<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flyers Drakkars</title>
<link href="assets/fonts.css" rel="stylesheet" />
<style>
  :root { --gold: #d4af37; --gold-bright: #f4ce6e; }
  * { box-sizing: border-box; margin: 0; }
  body { background: radial-gradient(ellipse at top, #15121c 0%, #08070b 55%); color: #fff; font-family: "Manrope", sans-serif; padding: 40px 24px 80px; min-height: 100vh; }
  header { max-width: 1400px; margin: 0 auto 32px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
  header img { height: 60px; }
  h1 { font: 700 22px/1.3 "Sora", sans-serif; }
  p { color: rgba(255,255,255,.6); font-size: 14px; margin-top: 4px; }
  .toggle { display: flex; gap: 6px; border: 1px solid rgba(212,175,55,.35); border-radius: 999px; padding: 4px; }
  .toggle button { background: none; border: 0; color: #fff; font: 700 13px "Sora"; letter-spacing: .14em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px; cursor: pointer; }
  .toggle button.on { background: linear-gradient(135deg, #f4ce6e, #d4af37 45%, #8a7226); color: #140f05; }
  .grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
  figure { margin: 0; }
  .frame { position: relative; width: 100%; aspect-ratio: 1080 / 1350; overflow: hidden; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); }
  body.story .frame { aspect-ratio: 1080 / 1920; }
  iframe { position: absolute; top: 0; left: 0; width: 1080px; height: 1920px; border: 0; transform-origin: 0 0; pointer-events: none; }
  figcaption { margin-top: 10px; display: flex; justify-content: space-between; font: 600 14px "Sora"; }
  figcaption a { color: var(--gold-bright); text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div><img src="assets/drakkars-logo.png" alt="Drakkars Producciones"><h1>Plantillas de flyer · Mesón Terraza León</h1><p>Edita <code>event.js</code> y recarga. Exporta PNG con <code>node flyers/render.mjs</code>.</p></div>
  <div class="toggle"><button data-f="post" class="on">Post 4:5</button><button data-f="story">Story 9:16</button></div>
</header>
<div class="grid" id="grid"></div>
<script>
  const names = ["Oro y Vino", "Aurora", "Dúo", "Editorial", "Art Déco", "Solista · Eclipse", "Solista · Retrato", "Solista · Cartel", "Solista · Neón", "Solista · Vinilo"];
  const grid = document.getElementById("grid");
  function render(f) {
    document.body.classList.toggle("story", f === "story");
    grid.innerHTML = names.map((n, i) => `
      <figure><div class="frame"><iframe src="flyer.html?v=${i + 1}&f=${f}&export" loading="lazy"></iframe></div>
      <figcaption><span>${i + 1} · ${n}</span><a href="flyer.html?v=${i + 1}&f=${f}" target="_blank">Abrir ↗</a></figcaption></figure>`).join("");
    scale();
  }
  function scale() { document.querySelectorAll(".frame").forEach((fr) => (fr.querySelector("iframe").style.transform = `scale(${fr.clientWidth / 1080})`)); }
  addEventListener("resize", scale);
  document.querySelectorAll(".toggle button").forEach((b) => (b.onclick = () => {
    document.querySelectorAll(".toggle button").forEach((x) => x.classList.toggle("on", x === b));
    render(b.dataset.f);
  }));
  render("post");
</script>
</body>
</html>
